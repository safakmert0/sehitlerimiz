name: 📱 Android Build + Release (APK)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 🏗️ Kaynak kod
        uses: actions/checkout@v4

      - name: 🟢 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: ☕ Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: 📦 Bağımlılıklar
        run: npm ci --legacy-peer-deps

      - name: 🔌 Supabase ortam değişkenleri (secret varsa)
        run: |
          if [ -n "${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}" ]; then
            echo "EXPO_PUBLIC_SUPABASE_URL=${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}" >> .env
            echo "EXPO_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}" >> .env
          fi

      - name: 🧱 Android projesini oluştur (prebuild)
        run: npx expo prebuild --platform android --no-install

      - name: 📲 APK derle (release)
        working-directory: android
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: 📦 APK'yı paketle
        run: |
          mkdir -p artifacts
          cp android/app/build/outputs/apk/release/app-release.apk artifacts/sehitlerimiz-${{ github.ref_name || 'manual' }}.apk 2>/dev/null \
            || cp android/app/build/outputs/apk/release/app-release-unsigned.apk artifacts/sehitlerimiz-${{ github.ref_name || 'manual' }}.apk

      - name: 📤 Artefakt olarak yükle
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: artifacts/*.apk

      - name: 🏷️ Release'e yükle (tag varsa)
        if: github.ref_type == 'tag'
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          gh release create "$TAG" --title "Şehitlerimiz $TAG" --generate-notes || true
          gh release upload "$TAG" artifacts/*.apk --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
